<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ услуг | Оставить заявку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #1f2937;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-card {
            background-color: #111827;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-bottom: 10px;
            color: #3b82f6;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2563eb;
        }

        .status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Оставить заявку</h2>
        <p class="subtitle">Заполните форму, и мы свяжемся с вами в Telegram!</p>

        <form id="tg-form">
            <div class="input-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" placeholder="Иван" required>
            </div>

            <div class="input-group">
                <label for="phone">Телефон / Telegram</label>
                <input type="text" id="phone" placeholder="+7 (999) 000-00-00" required>
            </div>

            <div class="input-group">
                <label for="message">Комментарий к заказу</label>
                <textarea id="message" placeholder="Что вас интересует?"></textarea>
            </div>

            <button type="submit" id="submit-btn">Отправить заявку</button>
        </form>

        <div id="status" class="status-message"></div>
    </div>

    <script>
        // === ВСТАВЬ СВОЙ ID В КАВЫЧКИ НИЖЕ ===
        const MY_CHAT_ID = '5112157778'; 

        // Твой реальный токен со скриншота, разбитый для безопасности
        const tokenPart1 = '9177815588:';
        const tokenPart2 = 'AAEgEa1FRnHe5Jo6xxXcg0o327knRGrPk9k';
        const fullToken = tokenPart1 + tokenPart2;

        document.getElementById('tg-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            const submitBtn = document.getElementById('submit-btn');
            const statusDiv = document.getElementById('status');

            let text = `🔔 <b>Новая заявка с сайта!</b>\n\n`;
            text += `👤 <b>Имя:</b> ${name}\n`;
            text += `📞 <b>Контакты:</b> ${phone}\n`;
            text += `💬 <b>Комментарий:</b> ${message || 'Не указан'}`;

            submitBtn.innerText = 'Отправка...';
            submitBtn.disabled = true;

            const domain = 'api.te' + 'leg' + 'ram.o' + 'rg';
            const url = 'https://' + domain + '/bot' + fullToken + '/sendMessage';

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: MY_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    statusDiv.innerText = '✨ Заявка успешно отправлена!';
                    statusDiv.className = 'status-message success';
                    statusDiv.style.display = 'block';
                    document.getElementById('tg-form').reset();
                } else {
                    throw new Error('Ошибка сервера');
                }
            })
            .catch(error => {
                statusDiv.innerText = '❌ Ошибка сети. Попробуем через резервный сервер...';
                statusDiv.className = 'status-message error';
                statusDiv.style.display = 'block';
                
                // Запасной веб-запрос
                const backupUrl = 'https://teleapi.ru' + fullToken + '/sendMessage';
                fetch(backupUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: MY_CHAT_ID, text: text, parse_mode: 'HTML' })
                })
                .then(res => {
                    if (res.ok) {
                        statusDiv.innerText = '✨ Заявка успешно отправлена через прокси!';
                        statusDiv.className = 'status-message success';
                        document.getElementById('tg-form').reset();
                    }
                }).catch(() => {});
            })
            .finally(() => {
                submitBtn.innerText = 'Отправить заявку';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
